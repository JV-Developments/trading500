<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Trading 500 Investments</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
.container{width:min(760px,100%);padding:34px 28px;background:#1e293b;border:1px solid #334155;border-radius:14px;box-shadow:0 14px 38px rgba(0,0,0,.32)}
.language-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;margin:0 0 34px}
.lang-btn{border:1px solid #475569;border-radius:5px;background:transparent;color:#cbd5e1;padding:7px 13px;font:inherit;font-size:.92rem;cursor:pointer}
.lang-btn:hover,.lang-btn:focus-visible,.lang-btn.active{color:#38bdf8;border-color:#38bdf8;background:#0f172a}
h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 18px;letter-spacing:-1px;background:linear-gradient(to right,#38bdf8,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{color:#cbd5e1;font-size:1.25rem;line-height:1.6;margin:0 auto;max-width:620px}
@media(max-width:480px){.container{padding:26px 18px}.language-bar{gap:8px;margin-bottom:28px}.lang-btn{padding:7px 10px;font-size:.85rem}}
</style>
</head>
<body>
<main class="container">
  <nav class="language-bar" aria-label="Select language">
    <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">English</button>
    <button class="lang-btn active" type="button" data-lang="es" aria-pressed="true">Español</button>
    <button class="lang-btn" type="button" data-lang="fr" aria-pressed="false">Français</button>
  </nav>
  <h1 id="page-title">Trading 500 Investments</h1>
  <p id="maintenance-message">Página en mantenimiento, y no admito colados. :)</p>
</main>
<script>
(function(){
  "use strict";
  const copy={
    es:{title:"Trading 500 Investments",message:"Página en mantenimiento, y no admito colados. :)"},
    en:{title:"Trading 500 Investments",message:"This page is under maintenance, and no sneaking in! :)"},
    fr:{title:"Trading 500 Investments",message:"Page en maintenance, et les resquilleurs ne sont pas admis ! :)"}
  };
  const buttons=document.querySelectorAll(".lang-btn");
  function setLanguage(lang){
    if(!copy[lang]) lang="es";
    const data=copy[lang];
    document.documentElement.lang=lang;
    document.title=data.title;
    document.getElementById("maintenance-message").textContent=data.message;
    buttons.forEach(function(button){
      const active=button.dataset.lang===lang;
      button.classList.toggle("active",active);
      button.setAttribute("aria-pressed",String(active));
    });
    try{localStorage.setItem("trading500-language",lang);}catch(error){}
  }
  buttons.forEach(function(button){button.addEventListener("click",function(){setLanguage(button.dataset.lang);});});
  let initial="en";
  try{initial=localStorage.getItem("trading500-language")||"en";}catch(error){}
  setLanguage(initial);
})();
</script>
</body>
</html>
