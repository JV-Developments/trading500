<script>
    const translations = {
        en: {
            title: "Keys to Trading and Investing in the S&P 500", coverSubtitle: "Keys to Trading and Investing in the S&P 500", author: "By J. Victory", homeButton: "Return to Home",
            indexTitle: "➢ Manual Index", indexSubtitle: "(If you want to start from scratch, consult this topic index)", contentsHeading: "Contents",
            contents: ["Preface", "The Stock Exchange, business hours and days", "The index we trade: S&P 500", "Before trading… take a shower", "When do we do a 'Call' or a 'Put'?", "What history teaches us…", "Keep records of everything you do", "Reliable Internet connection, an unmovable asset", "A broker will link to your bank account"],
            prefaceHeading: "Preface", prefaceParagraphs: ["This site was created as a basic guide for traders and investors. Here, you can learn to trade one of the most liquid markets in the world: the SPY index.", "When I started doing this a few years ago, I did it more with my heart than with my head, with my emotions running high, and I had to learn from countless mistakes. However, as time went by, I absorbed vital lessons that helped me improve my trading strategies, and that was when I also learned how to make money. It is possible to make a living from trading, and investing encompasses many things that are essential in life—not only in the stock market, but also in a home, a vehicle, education, and more. Each person must decide whether to trade or invest.", "It is important to understand that no one on earth, no matter how well prepared, wins every game. This means that stocks and markets will experience declines, since in many cases both microeconomic and macroeconomic situations affect the global economy and all market participants. However, since rule number one is precisely not to lose money, this goal can be achieved by following certain trading principles and accepting that the market is a world of opportunities—and those who understand it can succeed.", "The internet is full of digital books, and many of them try to fill your mind with countless economic indicators for making decisions. My goal is to distill practical strategies so you can get started as soon as possible. Without a doubt, you will learn how to do <i>paper trading</i>, or simulated trading. Once you feel capable of swimming on your own, you can decide whether to invest real money, guided by your knowledge and the instincts of your own trader personality, because you are unique in the world. Give it a try and choose to learn; you have much to gain. God bless you."],
            marketHeading: "The Stock Exchange", marketParagraphs: ["At the stock exchange (or Stock Market) (physical or virtual) its clients (buyers and sellers of shares) come together to buy, sell, or trade those securities. The exchange can be public or private. For practical purposes, we focus on saying that the <span class='ticker'>SPY</span> index, which concerns us, is traded on both the New York Stock Exchange and the Nasdaq.", "In the Inn of the Belgian textile worker, Robert Van der Burse, back in the 14th century, merchants gathered to negotiate different securities. In the Stock Exchange, both variable income (stocks) and fixed income (debt) are traded. Although the oldest exchanges date back to Greece and Rome, we have dates and places that tell us a lot about the evolution of this type of activity, such as the commodity exchange in Antwerp (1460), London (1570), Lyon, France (1595), the Madrid stock exchange in 1831, and the New York stock exchange in 1792.", "In synthesis, the objective of the stock exchange is basically... • to procure financing for those companies that require capital to expand their borders and • to allow investors at the same time to deposit their capital in search of a substantial return or profit.", "The hours for the NY stock exchange and the Nasdaq are Monday through Friday from 09:30 am until 4:15 pm. There are extended hours known as 'after hours' (until 8 pm), meaning after the stock market closes, and 'premarket' (before the bell rings), which runs from 4 am to 09:30 am EST. Finally, there are holidays when the Stock Exchange is closed."],
spyHeading: "The Standard & Poor's 500 Index", spyParagraphs: ["Better known as the S&P 500, this index tracks the performance of 500 large companies listed on stock exchanges in the United States. Among the most outstanding companies we can mention out of the 500 are: Apple, Nvidia, Microsoft, Alphabet, Amazon, Meta Platforms, Tesla, Berkshire Hathaway, and JP Morgan Chase. This mention is just to give you an idea of the economic power of these corporations.", "The breakdown of the S&P 500 sector is as follows: Information Technology 27.48% | Health Care 14.58% | Consumer Discretionary 11.18% | Communication Services 10.90% | Financials 9.89% | Industrials 7.90% | Consumer Staples 7.05% | Utilities 3.13% | Real Estate 2.80% | Materials 2.56% | Energy 2.53%", "As you can see, the technology segment occupies 27%, which is why when this sector trades down or, on the contrary, goes up, it significantly affects the S&P 500 index.", "Someone can undoubtedly trade stocks separately, such as Apple, Microsoft, etc. To do this, they should trade with 3, 4, or 5 companies at the same time, so that they can diversify, in such a way that they have a higher probability in some in case the others do not turn out well. However, the purpose of this manual, as I said at the beginning, is to focus primarily on the S&P 500 index and then on the companies separately."],
homeHeading: "Office-fy Your Home", homeParagraphs: ["Just because you are working from home and in slippers does not mean you shouldn't take a shower. It is a gross mistake to trade without having all your senses on alert, in addition to being well-nourished. That is why it is important to give your home a certain office air, with the essentials to function.", "After the proper cleaning of your body, a calm state, and good breathing, have the basic tools at hand: a notebook, pencil and pen, calculator, your computer and cell phone, and above all, a reliable internet connection. Realize that if this fails and you have open positions, you will not be able to close them, whether for profit or loss. Have you noticed that professional traders have multiple screens? The more information you handle, the better, because many decisions sometimes have to be made in seconds. However, thanks to the information provided in this guide, you will not require 10 screens to trade because the only information you are going to need is provided in a dynamic Google Sheet or Excel table that I provide for you.", "If you have basic knowledge of Excel, you can make different tables to record your trading activity. If you do not have that skill, you can do it by hand. The important thing here—although I will expand on this later—is that you take note of the position you have decided to open, the number of contracts, strike price, expiration date, entry and exit time, the percentage you won or lost, and a box to enter the result of your trading day. Getting used to registering everything you do will strengthen your weaknesses and increase your profits."],
directionHeading: "Up or Down?", directionParagraphs: ["That is the transaction and decision we must make when we trade: • a 'Call' if we believe that the price of the index or stock is going to go up, or • a 'Put' if, on the contrary, we perceive that it is going to go down.", "Although there are other strategies in the field of trading and investments, we will only consider two directions: ascent (call) and descent (put). But I want to make something very clear: trading is not luck, and this does not consist of guessing.", "In reality, for you to estimate that the market or a certain stock is going in a certain direction, it is because you have done a study on the different variables that affect it. A call option is a financial derivative that gives the buyer the right (but not the obligation) to buy an asset in a future time at a certain price from the hands of the seller. In options, the buyer does not necessarily keep the stocks; they simply trade them, that is, the assets pass from hand to hand."],
historyHeading: "History Repeats Itself", historyParagraphs: ["The famous and millionaire trader W. D. Gann (June 6, 1878 – June 18, 1955) once wrote the following: 'My calculations are based on cyclic theory and mathematical sequences. History repeats itself. That is what I have always asserted, that to know and predict the future of anything you only have to look at what has happened in the past and have a correct basis or starting point. My authority for assuring that the future is nothing but the repetition of the past is found in the Bible.'", "Evidently, Gann was not only a fabulous trader, but his books are still read today as a source of consultation for investors.", "It is therefore of utmost importance that the trader must accept that what happened will inevitably happen again, and thus be prepared to take advantage of opportunities. History must be an incentive for each of us when we have difficult days, in the sense that we can have comebacks, or also when we have smiles on our lips having repeated a scene from earlier times in the present moment."],
writeHeading: "“qui scribit bis legit”, (“he who writes, reads twice”)", writeParagraphs: ["When you take on the task of writing and keeping a record of everything that has happened in your trading session, without a doubt, it will contribute enormously to your progress as a professional trader. You will be able to review at the end of the day what your starting plan was, how you finished, and what possible mistakes you might have made or how successful your strategy was, representing juicy dividends.", "You must include in your records: tables, charts, and comments, as well as links to useful internet sites, and this will make you have important tools at your fingertips.", "The vast majority of investors have always recommended something very simple: 'you must know what you are doing, and know how to interpret financial instruments.' This has been said continuously in his conferences by Warren Buffett, one of the best stock investors in history. Knowing the meaning of the basic concepts of trading and accepting the imminent repetition of history will give you peace for your future actions. To give more emphasis to this short thought, and so you do not leave your data in your mind alone, let us remember the words of the Spanish writer Miguel Unamuno: 'it is better to have a short pencil than a long memory'"],
connectHeading: "Do you have a good connection?", connectParagraphs: ["Just as it is essential to have very good communication with your loved ones and your neighbor in general, in the same way, it is of vital importance that you have an excellent internet signal to trade from anywhere in the world. What you least want in this discipline is to lose your internet signal when you are in an important transaction. This occupation gives you the opportunity to generate income from any country on the planet, but for this, you are going to require your connection to have no failures, since seconds in the transmission of your orders—whether to carry out your transaction of the day (be it buy, sell, or both)—are worth a lot. The movement of data on the Web is so fast that even a few seconds can cost you money. This increases when there is a lot of volatility¹ and volume² in the market.", "The ideal would be for you to connect in two ways: with your laptop (PC) and your cell phone. If the PC should fail, you will have your mobile to continue your trading session. I want to point out that independent of the strategy you are going to use in your session, whether day trading (scalping, for example), swing trading (exiting in 1 or more days), or investing (long term), your connection must offer a certain form of peace of mind. For all of the above, you will learn to leave (set) your stop loss³, or failing that, if you are winning, raise your trailing stop⁴. Leaving the order ready to secure profits in case your stock goes in the desired direction, whether up or down, is advantageous, especially when you have defined a ready exit point.", "¹ Rapid variation of prices | ² Titles or contracts traded of a financial asset in a market | ³ Sell order to limit the amount of an eventual loss | ⁴ Order to secure profits in case your action goes in the desired direction, whether up or down."],
brokerHeading: "The Broker... will execute your orders", brokerParagraphs: ["Indeed, to be able to enter the trading arena, a broker will link your bank account with theirs so you can deposit money, buy, sell, and withdraw your profits daily. There are different types of brokers, some do not charge fees for trading options, while others offering more services do.", "Not all brokers operating in the United States operate the same way abroad. For this, you must search the internet to see which brokers are available in your region that perform not only stock buying and selling but also options trading, which is what we teach in this manual. Some do not charge commissions, others do, usually $0.65 per contract to enter and exit. Example: if you buy 10 contracts of a stock or index you must pay $6.50 to enter and the same amount to exit. Fees vary from broker to broker. There are also platforms that do not charge you.", "In the United States, for example, I recommend Robinhood for beginners: they do not charge fees for options. If you subscribe with them and add the Gold service (for only $5 US a month), your deposits will be instant. Your account can be opened in 3 ways: instant, gold, and cash. Open your account immediately. If Robinhood is not in your country, try Fidelity. Open an account with them."]
},
es: {
title: "Claves para hacer trading e invertir en el índice S&P 500", coverSubtitle: "Claves para hacer trading e invertir en el S&P 500", author: "Por J. Victory", homeButton: "Regresar a la portada",
indexTitle: "➢ Indice del Manual", indexSubtitle: "(si deseas empezar desde cero, consulta este índice de temas)", contentsHeading: "Contenido",
contents: ["Prefacio", "La Bolsa de Valores, horas y días de negocio", "El índice que transamos: S&P 500", "Antes de transar … date un baño", "¿Cuándo hacemos un “Call” o un “Put”?", "Lo que nos enseña … la historia", "Ante todo, toma apuntes y registra todo lo que haces", "Conexión a Internet confiable, un inamovible", "Un broker se ligará a tú cuenta bancaria"],
prefaceHeading: "Prefacio", prefaceParagraphs: ["Este sitio ha sido creado para ser guía básica de traders e inversionistas. En él, tú podrás aprender a <span class='term-tooltip' tabindex='0'>transar<span class='term-tooltip-text'>Transar el índice S&amp;P 500 —de las empresas más grandes de EE. UU.— significa comprar o vender instrumentos financieros que siguen el precio de este, para intentar obtener una ganancia con sus movimientos.</span></span> uno de los mercados más líquidos del mundo: el índice SPY.", "Cuando empecé a hacerlo hace algunos años, lo hice más con el corazón que con la razón, con mis emociones a mil, y me tocó aprender de un sinnúmero de errores. Sin embargo, con el paso del tiempo, fui asimilando lecciones vitales para mejorar mis estrategias en el trading, y fue allí cuando también aprendí a ganar. Es posible vivir del trading, e invertir abarca muchas cosas necesarias en la vida (no solo en la Bolsa de Valores, sino también en una casa, un vehículo, educación, etc.). Cada persona tomará la decisión de si desea transar o invertir.", "Es importante entender que nadie sobre la faz de la tierra, por muy preparado que esté, va a ganar todos los partidos. Esto quiere decir que habrá caídas de acciones y de mercados, pues en muchos casos hay situaciones no solo microeconómicas sino también macroeconómicas que inciden en la economía mundial y afectan a todos los participantes. Sin embargo, ya que la regla número uno es justamente no perder dinero, esto será posible alcanzarlo en la medida en que se obedezcan ciertos principios del trading y se acepte que el mercado es un mundo de oportunidades, y que quien lo conoce triunfa.", "El internet está lleno de libros digitales, y muchos pretenden llenar tu mente de incontables indicadores económicos para la toma de decisiones. Mi meta es sintetizar estrategias prácticas para que puedas arrancar cuanto antes. Sin duda, aprenderás a hacer <i>paper trading</i>, o simulación. Una vez que te sientas en capacidad de nadar por ti mismo, puedes tomar la decisión de invertir dinero real siguiendo el conocimiento y los instintos de tu propia personalidad de trader, pues eres único en el mundo. Inténtalo y decide aprender; tienes mucho que ganar. Dios te bendiga."],
marketHeading: "La Bolsa de Valores", marketParagraphs: ["En la bolsa de valores (o Mercado de Acciones) (física o virtual) sus clientes (los compradores y vendedores de acciones) se juntan para comprar, vender o transar dichos valores. La bolsa puede ser pública o privada. Para fines prácticos, nos concentramos en decir que el índice SPY al cual nos concierne se transa tanto en la bolsa de Nueva York como en el Nasdaq.", "En el Mesón del textilero belga, Robert Van der Burse por alla en el siglo 14, se reunían comerciantes a negociar diferentes valores. En la Bolsa se negocian tanto renta variable (acciones) como renta fija (deuda). Aunque las bolsas más antiguas se remontan a Grecia y Roma, tenemos fecha y lugares que nos dicen mucho sobre la evolución de este tipo de actividad, como la bolsa de materias primas en Amberes (1460), Londres (1570), Lyon, Francia (1595), la bolsa de Madrid en 1831 y la de Nueva York en 1792.", "En síntesis, el objetivo de la bolsa de valores es básicamente… • procurar financiamiento a aquellas empresas que requieren de capital para ensanchar sus fronteras y • permitir al mismo tiempo que inversionistas depositen su capital en procura de un retorno o ganancia sustancial.", "El horario de la bolsa de NY y el Nasdaq es de lunes a viernes de 09:30 am hasta las 4:15 pm. Hay horarios extendidos conocidos como “after hours” (hasta las 8 pm) es decir, después del cierre de la bolsa y “premarket”; (antes del toque de campana) y que va de 4 am a 09:30 am EST. Finalmente hay días feriados cuando la Bolsa está cerrada."],
spyHeading: "El Indice Standard & Poor's 500", spyParagraphs: ["Más conocido como el S&P 500, este índice sigue el rendimiento de 500 grandes empresas que cotizan en las bolsas de valores de los Estados Unidos. Entre las empresas más sobresalientes podemos mencionar de las 500 a: Apple, Nvidia, Microsoft, Alphabet, Amazon, Meta Platforms, Tesla, Nvidia, Berkshire Hathaway y JP Morgan Chase. Esta mención es solo para darte una idea del poderío económico de estas corporaciones.", "El desglose del sector S&P 500, es así: Tecnología de la Información 27.48% | Cuidado de la Salud 14.58% | Consumidor Discrecional 11.18% | Servicios de Comunicación 10.90% | Finanzas 9.89% | Acciones Industriales 7.90% | Productos Básicos de Consumo 7.05% | Utilidades 3.13% | Bienes Raíces 2.80% | Materiales 2.56% | Energía 2.53%", "Como puedes ver, el segmento de la tecnología ocupa un 27%, por lo cual cuando este sector transa a la baja o por el contrario va al alza, afecta significativamente el índice S&P 500.", "Alguien puede sin duda, transar stocks (acciones) separadamente, como por ejemplo Apple, Microsoft, etc. Para ello debería hacer trading con 3, 4 o 5 empresas al mismo tiempo, cosa que pueda diversificar, de tal manera que tenga mayor probabilidad en unas por si las otras no salen bien. Sin embargo, el propósito de este manual como dije al principio es enfocarnos en primera instancia en el índice S&P 500 y luego en las empresas por separado."],
homeHeading: "Ofici-na tu Casa", homeParagraphs: ["Por el simple hecho de que estás trabajando desde tu casa y en pantuflas, no significa que no debas darte un baño. Es un craso error hacer trading sin tener todos los sentidos en alerta, además de estar bien alimentado. Por eso es importante que a tu casa le des un cierto aire de oficina, con lo esencial para funcionar.", "Después del debido aseo de tu cuerpo, de un estado calmado y buena respiración, ten a mano los útiles básicos: una libreta de apuntes, lápiz y lapicero, calculadora, tu computador y celular y ante todo una confiable conexión a internet. Date cuenta que si esta falla y tienes posiciones abiertas, no podrás cerrarlas ya sea para provecho o pérdida. ¿Has notado que los traders profesionales tienen varias pantallas? Mientras más información manejes mejor, pues muchas de las decisiones a veces las debes hacer en segundos. Sin embargo y gracias a la información prevista en esta guía, no requerirá 10 pantallas para hacer trading pues la única información que vas a necesitar es provista en una dinámica tabla de google sheet o excel que te proveo.", "Si tienes conocimientos básicos de Excel, puedes hacer diferentes tablas para que registres tu actividad de trading. Si no tienes esa habilidad, puedes hacerla a mano. Lo importante aquí, -aunque expandiré esto más adelante- es que tomes nota de la posición que has decidido abrir, el número de contratos, strike price, fecha de expiración, hora de entrada y salida, porcentaje que has ganado o perdido y una casilla para que se ingrese el resultado de tu día de trading. El acostumbrarse a registrar todo lo que haces, fortalecerá tus debilidades e incrementará tus ganancias."],
directionHeading: "Sube o baja?", directionParagraphs: ["Esa es la transacción y decisión que debemos tomar cuando transamos: • un “Call” si creemos que el precio del índice o stock va a subir, o • un “Put” si por el contrario, percibimos que va a bajar.", "Aunque existen otras estrategias en el campo del trading e inversiones, solo consideraremos dos direcciones: ascenso (call) y descenso (put). Pero quiero dejar algo bien claro: el trading no es suerte, y esto no consiste en adivinar.", "En realidad, para que tú estimes que el índice o una determinada acción (stock) va en cierta dirección, es porque has hecho un estudio sobre las diferentes variables que lo afectan. La opción de compra es un derivado financiero que da al comprador, el derecho (mas no la obligación) de comprar un activo en un tiempo futuro a un determinado precio de manos del vendedor. En las opciones no necesariamente el comprador de ella se queda con los stocks, simplemente los transa, es decir, los activos pasan de mano en mano."],
historyHeading: "La historia se repite", historyParagraphs: ["El famoso y millonario trader W. D Gann (Junio 6, 1878 – Junio 18, 1955) una vez escribió lo siguiente: “Mis cálculos están basados en la teoría cíclica y en secuencias matemáticas. La historia se repite. Eso es lo que siempre he afirmado, que para saber y predecir el futuro de algo solo tienes que mirar lo que ha sucedido en el pasado y tener una base correcta o punto de partida. Mi autoridad para asegurar que el futuro no es otra cosa que la repetición del pasado se encuentra en la Biblia”.", "Evidentemente, Gann no solo fue un fabuloso trader sino que aun sus libros son leídos hoy día como fuente de consulta para inversionistas.", "Es por ello de suma importancia que el trader debe aceptar que lo que pasó, indefectiblemente volverá a acontecer y así estar preparado para aprovechar las oportunidades. La historia debe ser un aliciente para cada uno de nosotros cuando tengamos días difíciles, en el sentido de que podremos tener remontadas o también cuando tengamos sonrisas en nuestros labios al haber repetido en tiempo presente una escena de tiempos anteriores."],
writeHeading: "“qui scribit bis legit”, (“quien escribe, lee dos veces”)", writeParagraphs: ["Cuando te das a la tarea de escribir y llevar registro de todo lo que ha sucedido en tu sesión de trading, sin duda, contribuirá enormemente a tu progreso como trader profesional. Vas a poder revisar al final del día, cuál fue tu plan de inicio, como terminaste y que posibles errores pudiste haber cometido o que exitosa fue tu estrategia que te representó jugosos dividendos.", "Debes incluir en tus registros: tablas, gráficos (charts), y comentarios, así como vínculos (links) de sitios de internet útiles, y esto hará que tengas herramientas importantes al alcance de tus dedos.", "La gran mayoría de inversionistas siempre han recomendado algo muy simple: “debes saber, lo que estás haciendo, y saber interpretar los instrumentos financieros”. Esto lo ha dicho continuamente en sus conferencias Warren Buffet, uno de los mejores inversionistas en stocks en la historia. El conocer el significado de los conceptos básicos del trading y el aceptar la inminente repetición de la historia te dará paz para tus futuras acciones. Para darle más énfasis a este corto pensamiento, y no dejes tus datos en la mente solamente, recordemos las palabras del escritor español Miguel Unamuno: “vale más tener un lápiz corto que una memoria larga”"],
connectHeading: "¿Tienes una buena conexión?", connectParagraphs: ["Así como es imprescindible tener una muy buena comunicación con tus seres queridos y el prójimo en general, de la misma forma, es de vital importancia que tengas una excelente señal de internet para hacer trading desde cualquier lugar del mundo. Lo que menos deseas en esta disciplina es que pierdas tu señal de internet cuando estás en una transacción importante. Esta ocupación te da la oportunidad de generar ingresos desde cualquier país del planeta, pero para ello vas a requerir que tu conexión no tenga fallas, ya que segundos en la transmisión de tus órdenes ya sea para realizar tu transacción del día (sea compra, venta o ambas) valen muchos. Es tan rápido el movimiento de datos en la Web, que aun unos cuantos segundos pueden costarte dinero. Esto aumenta cuando hay mucha volatilidad¹ y volumen² en el mercado.", "El ideal sería que te conectes de dos formas: con tu portátil (PC) y tu celular. Si llegase a fallar el PC, tendrás tu móvil para continuar tu sesión de trading. Quiero señalar que independiente de la estrategia que vas a usar en tu sesión, sea day trading (scalping, por ejemplo), swing trading (salir en 1 o más días) o inversión (largo plazo), tu conexión debe ofrecer cierta forma de tranquilidad. Por todo lo anterior, aprenderás a dejar (setear), tu stop loss³, o en su defecto, si vas ganando, subir tu trailing stop⁴. El dejar lista la orden para asegurar ganancias en caso que tu acción vaya en el sentido deseado, sea hacia arriba o abajo es ventajoso, especialmente cuando has definido lista un punto de salida.", "¹ Variación rápida de los precios | ² títulos o contratos que se negocian de un activo financiero en un mercado | ³ orden de venta para limitar la cantidad de una eventual pérdida | ⁴ orden para asegurar ganancias en caso que tu acción vaya en el sentido deseado, sea hacia arriba o abajo."],
brokerHeading: "El Corredor de Bolsa… ejecutará tu encargo", brokerParagraphs: ["Efectivamente, para poder ingresar a la arena del trading, un corredor de bolsa y que se conoce como broker, será quien ligue tu cuenta bancaria con la suya y así tengas la capacidad para depositar dinero en su cuenta y comprar, vender, y retirar tus ganancias a diario. Hay diferentes tipos de broker, y algunos de ellos no cobran fees (cargos) por hacer opciones en trading, otros que ofrecen más servicios si los cobran.", "No todos los brokers que operan en Estados Unidos lo hacen igualmente en el extranjero. Para ello debes googlear en el Internet qué brokers están disponibles en tu región, y que hagan no solo compra y venta de acciones (stocks) sino también de opciones, que es lo que enseñamos en este manual. Algunos no cobran comisiones, otros si lo hacen, usualmente $0.65 centavos de dólar por contrato para entrar y salir. Ejemplo: si compras 10 contratos de un stock o index debes pagar $6.50 para entrar y la misma cantidad para salir. Los “fees” (cargos) varían de broker a broker. También hay plataformas que no te cobran.", "En Estados Unidos por ejemplo recomiendo Robinhood para los principiantes: no cobran fees por opciones. Si te suscribes con ellos y le agregas el servicio Gold (por solo $5 US al mes), tus depósitos serán instantáneos, es decir, tú dinero estará disponible de inmediato para hacer trading. Tu cuenta puedes abrirla en 3 formas: instantánea, oro (gold) y cash (efectivo). Abre tu cuenta de inmediato. Si Robinhood no está en tu país, trata Fidelity. Abre una cuenta con ellos."]

contents: ["Préface", "La Bourse, heures et jours d'ouverture", "L'indice que nous négocions : S&P 500", "Avant de négocier… prenez une douche", "Quand faisons-nous un 'Call' ou un 'Put' ?", "Ce que l'histoire nous enseigne…", "Gardez des traces de tout ce que vous faites", "Connexion Internet fiable, un atout inébranlable", "Un courtier se liera à votre compte bancaire"],
prefaceHeading: "Préface", prefaceParagraphs: ["Ce site a été créé pour servir de guide de base aux traders et aux investisseurs. Vous pourrez y apprendre à négocier sur l’un des marchés les plus liquides au monde : l’indice SPY.", "Lorsque j’ai commencé il y a quelques années, j’agissais davantage avec le cœur qu’avec la raison, emporté par mes émotions, et j’ai dû apprendre de mes innombrables erreurs. Cependant, avec le temps, j’ai assimilé des leçons essentielles qui m’ont permis d’améliorer mes stratégies de trading, et c’est alors que j’ai également appris à gagner. Il est possible de vivre du trading, et l’investissement englobe de nombreux aspects essentiels de la vie — pas seulement la Bourse, mais aussi un logement, un véhicule, l’éducation, etc. Chaque personne décidera si elle souhaite faire du trading ou investir.", "Il est important de comprendre que personne sur terre, aussi bien préparé soit-il, ne gagne toutes les parties. Cela signifie que les actions et les marchés connaîtront des baisses, car, dans bien des cas, des facteurs microéconomiques et macroéconomiques influent sur l’économie mondiale et touchent tous les participants. Cependant, puisque la règle numéro un consiste précisément à ne pas perdre d’argent, cet objectif peut être atteint en respectant certains principes du trading et en acceptant que le marché est un monde d’opportunités, où ceux qui le connaissent réussissent.", "Internet regorge de livres numériques, et beaucoup cherchent à remplir votre esprit d’innombrables indicateurs économiques pour prendre des décisions. Mon objectif est de synthétiser des stratégies pratiques afin que vous puissiez vous lancer au plus vite. Sans aucun doute, vous apprendrez à faire du <i>paper trading</i>, c’est-à-dire du trading simulé. Lorsque vous vous sentirez capable de nager de vos propres ailes, vous pourrez décider d’investir de l’argent réel en vous appuyant sur vos connaissances et sur les instincts qui caractérisent votre propre personnalité de trader, car vous êtes unique au monde. Essayez et choisissez d’apprendre : vous avez beaucoup à gagner. Que Dieu vous bénisse."],
marketHeading: "La Bourse", marketParagraphs: ["À la bourse de valeurs (ou Marché des Actions) (physique ou virtuelle), ses clients (les acheteurs et les vendeurs d'actions) se rassemblent pour acheter, vendre ou négocier ces valeurs. La bourse peut être publique ou privée. À des fins pratiques, nous nous conseisons sur l'indice SPY qui nous concerne et qui se négocie à la fois à la bourse de New York et au Nasdaq.", "Dans l'auberge du travailleur du textile belge, Robert Van der Burse, vers le XIVe siècle, des marchands se réunissaient pour négocier différentes valeurs. En Bourse, on négocie aussi bien des actions (revenus variables) que des obligations (revenus fixes). Bien que les bourses les plus anciennes remontent à la Grèce et à la Rome antiques, nous avons des dates et des lieux qui nous en disent long sur l'évolution de ce type d'activité, comme la bourse des matières premières à Anvers (1460), Londres (1570), Lyon, France (1595), la bourse de Madrid en 1831 et celle de New York en 1792.", "En résumé, l'objectif de la bourse est fondamentalement... • obtenir un financement pour les entreprises qui ont besoin de capitaux pour élargir leurs frontières et • permettre en même temps aux investisseurs de déposer leur capital en vue d'un rendement ou d'un gain substantiel.", "Les horaires de la bourse de NY et du Nasdaq sont du lundi au vendredi de 09h30 à 16h15. Il existe des horaires élargis appelés 'after hours' (jusqu'à 20h), c'est-à-dire après la fermeture de la bourse, et 'premarket' (avant la cloche d'ouverture), qui s'étend de 4h à 09h30 EST. Le marché est fermé pendant les jours fériés."],
spyHeading: "L'Indice Standard & Poor's 500", spyParagraphs: ["Mieux connu sous le nom de S&P 500, cet indice suit la performance de 500 grande entreprises cotées sur les bourses américaines. Parmi les entreprises les plus marquantes des 500, citons : Apple, Nvidia, Microsoft, Alphabet, Amazon, Meta Platforms, Tesla, Berkshire Hathaway et JP Morgan Chase. Cette mention vise juste à vous donner une idée de la puissance économique de ces corporations.", "La répartition sectorielle du S&P 500 est la suivante : Technologies de l'information 27.48% | Santé 14.58% | Consommation discrétionnaire 11.18% | Services de communication 10.90% | Finance 9.89% | Actions industrielles 7.90% | Produits de consommation de base 7.05% | Services publics 3.13% | Immobilier 2.80% | Matériaux 2.56% | Énergie 2.53%", "Comme vous pouvez le constater, le segment technologique occupe 27 %, c'est pourquoi lorsque ce secteur évolue à la baisse ou, au contraire, augmente, il affecte de manière significative l'indice S&P 500.", "On peut sans doute négocier des actions séparément, comme Apple, Microsoft, etc. Pour ce faire, il faudrait faire du trading avec 3, 4 ou 5 entreprises en même temps afin de se diversifier, de manière à maximiser les probabilités si certaines ne fonctionnent pas bien. Cependant, le but de ce manuel, comme je l'ai dit au début, est de se concentrer en premier lieu sur l'indice S&P 500, puis sur les entreprises séparément."],
homeHeading: "Faites de Votre Maison Votre Bureau", homeParagraphs: ["Ce n'est pas parce que vous travaillez à la maison en pantoufles que vous ne devez pas prendre de douche. C'est une grave erreur de faire du trading sans avoir tous ses sens en alerte, en plus d'être bien nourri. C'est pourquoi il est important de donner à votre maison un certain air de bureau, avec l'essentiel pour fonctionner.", "Après un bon nettoyage de votre corps, un état d'esprit calme et une bonne respiration, gardez à portée de main les outils de base : un carnet de notes, un crayon et un stylo, une calculatrice, votre ordinateur et votre téléphone portable et, surtout, une connexion internet fiable. Sachez que si celle-ci échoue et que vous avez des positions ouvertes, vous ne pourrez pas les fermer, que ce soit pour en tirer profit ou pour accuser une perte. Avez-vous remarqué que les traders professionnels ont plusieurs écrans ? Plus vous gérez d'informations, mieux c'est, car de nombreuses décisions doivent parfois être prises en quelques secondes. Cependant, grâce aux informations fournies dans ce guide, vous n'aurez pas besoin de 10 écrans pour trader car la seule information dont vous aurez besoin est fournie dans un tableau dynamique Google Sheet ou Excel que je vous procure.", "Si vous avez des connaissances de base en Excel, vous pouvez créer différents tableaux pour enregistrer votre activité de trading. Si vous n'avez pas cette compétence, vous pouvez le faire à la main. L'important ici — même si je développerai cela plus tard — est que vous preniez note de la position que vous avez décidé d'ouvrir, du nombre de contrats, du prix d'exercice (strike), de la date d'expiration, de l'heure d'entrée et de sortie, du pourcentage de gain ou de perte et d'une case pour inscrire le résultat de votre journée de trading. S'habituer à tout enregistrer renforcera vos faiblesses et augmentera vos profits."],
directionHeading: "Hausse ou Baisse?", directionParagraphs: ["C'est la transaction et la décision que nous devons prendre lorsque nous négocions : • un 'Call' si nous pensons que le prix de l'indice ou de l'action va augmenter, ou • un 'Put' si, au contraire, nous percevons qu'il va baisser.", "Bien qu'il existe d'autres stratégies dans le domaine du trading et des investissements, nous ne considérerons que deux directions : la hausse (call) et la baisse (put). Mais je veux clarifier quelque chose : le trading n'est pas une question de chance, et cela ne consiste pas à deviner.", "En réalité, pour estimer que le marché ou une certaine action va dans une direction précise, c'est parce que vous avez étudié les différentes variables qui l'affectent. Une option d'achat est un dérivé financier qui donne à l'acheteur le droit (mais pas l'obligation) d'acheter un actif dans un avenir déterminé à un certain prix auprès du vendeur. Dans les options, l'acheteur ne conserve pas nécessairement les actions ; il les négocie simplement, c'est-à-dire que les actifs passent de main en main."],
historyHeading: "L'histoire se répète", historyParagraphs: ["Le célèbre et millionnaire trader W. D. Gann (6 juin 1878 - 18 juin 1955) a écrit un jour ceci : 'Mes calculs sont basés sur la théorie cyclique et les séquences mathématiques. L'histoire se répète. C'est ce que j'ai toujours affirmé : pour connaître et prédire l'avenir de quelque chose, il suffit de regarder ce qui s'est passé dans le passé et d'avoir une base ou un point de départ correct. Mon autorité pour assurer que l'avenir n'est que la répétition du passé se trouve dans la Bible.'", "Évidemment, Gann n'était pas seulement un trader fabuleux, ses livres sont encore lus aujourd'hui comme source de consultation pour les investisseurs.", "Il est donc de la plus haute importance que le trader accepte que ce qui s'est passé se reproduira inévitablement, et qu'il soit ainsi prêt à saisir les opportunités. L'histoire doit être un encouragement pour chacun de nous lorsque nous traversons des journées difficiles, dans le sens où nous pouvons connaître des remontées, ou aussi lorsque nous avons le sourire aux lèvres pour avoir répété dans le présent une scène du passé."],
writeHeading: "“qui scribit bis legit”, (“celui qui écrit, lise deux fois”)", writeParagraphs: ["Lorsque vous vous donnez pour tâche d'écrire et de tenir un registre de tout ce qui s'est passé au cours de votre séance de trading, cela contribuera sans aucun doute énormément à vos progrès en tant que trader professionnel. Vous pourrez revoir en fin de journée quel était votre plan de départ, comment vous avez fini et quelles erreurs éventuelles vous auriez pu commettre ou quel a été le succès de votre stratégie qui vous a rapporté de juteux dividendes.", "Vous devez inclure dans vos registres : des tableaux, des graphiques (charts) et des commentaires, ainsi que des liens vers des sites internet utiles, ce qui vous permettra d'avoir des outils importants à portée de main.", "La grande majorité des investisseurs a toujours recommandé quelque chose de très simple : 'vous devez savoir ce que vous faites et savoir interpréter les instruments financiers'. C'est ce que répète continuellement dans ses conférences Warren Buffett, l'un des meilleurs investisseurs en actions de l'histoire. Connaître la signification des concepts de base du trading et accepter l'imminente répétition de l'histoire vous donnera la paix pour vos actions futures. Pour donner plus d'importance à cette courte pensée, et pour ne pas laisser vos données dans votre esprit seulement, rappelons les mots de l'écrivain espagnol Miguel Unamuno : ''il vaut mieux avoir un crayon court qu'une longue mémoire''"],
connectHeading: "Avez-vous une bonne connexion ?", connectParagraphs: ["Tout comme il est indispensable d'avoir une très bonne communication avec ses proches et son prochain en général, de la même manière, il est d'une importance vitale de disposer d'un excellent signal internet pour trader depuis n'importe où dans le monde. Ce que vous souhaitez le moins dans cette discipline, c'est de perdre votre signal internet lorsque vous êtes au milieu d'une transaction importante. Cette occupation vous donne la possibilité de générer des revenus depuis n'importe quel pays de la planète, mais pour cela, vous allez avoir besoin que votre connexion ne présente aucune défaillance, car les secondes dans la transmission de vos ordres — que ce soit pour réaliser votre transaction du jour (achat, vente ou les deux) — valent cher. Le mouvement des données sur le Web is so rapide que même quelques secondes peuvent vous coûter de l'argent. Cela augmente lorsqu'il y a beaucoup de volatilité¹ et de volume² sur le marché.", "L'idéal serait de vous connecter de deux manières : avec votre ordinateur portable (PC) et votre téléphone portable. Si le PC venait à tomber en panne, vous auriez votre mobile pour continuer votre séance de trading. Je tiens à préciser qu'indépendamment de la stratégie que vous allez utiliser au cours de votre séance, qu'il s'agisse de day trading (scalping, par exemple), de swing trading (sortir en 1 jour ou plus) ou d'investissement (long terme), votre connexion doit offrir une certaine forme de tranquillité d'esprit. Pour tout ce qui précède, vous apprendrez à laisser (paramétrer) votre stop loss³, ou à défaut, si vous gagnez, à monter votre trailing stop⁴. Laisser l'ordre prêt pour sécuriser les gains au cas où votre action irait dans le sens souhaité, que ce soit à la hausse ou à la baisse, est avantageux, surtout lorsque vous avez défini un point de sortie clair.", "¹ Variation rapide des prix | ² titres ou contrats négociés d'un actif financier sur un marché | ³ ordre de vente pour limiter le montant d'une perte éventuelle | ⁴ ordre pour sécuriser les gains au cas où votre action irait dans le sens souhaité, à la hausse ou à la baisse."],
brokerHeading: "Le courtier... exécutera vos ordres", brokerParagraphs: ["En effet, pour pouvoir entrer dans l'arène du trading, un courtier liera votre compte bancaire au sien afin que vous puissiez déposer de l'argent, acheter, vendre et retirer vos gains quotidiennement. Il existe différents types de courtiers, certains ne facturent pas de frais pour le trading d'options, tandis que d'autres offrant plus de services le font.", "Tous les courtiers opérant aux États-Unis ne fonctionnent pas de la même manière à l'étranger. Pour cela, vous devez chercher sur internet quels courtiers sont disponibles dans votre région et qui effectuent non seulement l'achat et la vente d'actions mais aussi le trading d'options, ce qui es ce que nous enseignons dans ce manuel. Certains ne facturent pas de commissions, d'autres oui, généralement 0,65 $ par contrat pour entrer et sortir. Les frais varient d'un courtier à l'autre. Il existe également des plateformes qui ne vous facturent pas.", "Aux États-Unis, par exemple, je recommande Robinhood pour les débutants : ils ne facturent pas de frais pour les options. Si vous vous abonnez chez eux et ajoutez le service Gold (pour seulement 5 $ US par mois), vos d'achats seront instantanés. Votre compte peut être ouvert de 3 manières : instantané, gold et cache. Ouvrez votre compte immédiatement. Si Robinhood n'est pas dans votre pays, essayez Fidelity. Ouvrez un compte chez eux."]
}
};
function changeLanguage(lang) {
const buttons = document.querySelectorAll('.lang-btn');
buttons.forEach(btn => btn.classList.remove('active'));
const activeBtn = document.getElementById('btn-' + lang);
if (activeBtn) activeBtn.classList.add('active');
document.getElementById('main-title').innerText = translations[lang].title;
document.getElementById('author-tag').innerText = translations[lang].author;
document.getElementById('home-btn').innerText = translations[lang].homeButton;
document.getElementById('cover-subtitle').innerText = translations[lang].coverSubtitle;
document.getElementById('index-title').innerText = translations[lang].indexTitle;
document.getElementById('index-subtitle').innerText = translations[lang].indexSubtitle;
document.getElementById('contents-heading').innerText = translations[lang].contentsHeading;
const listContainer = document.getElementById('contents-list');
listContainer.innerHTML = '';
translations[lang].contents.forEach(item => {
const li = document.createElement('li'); li.innerText = item; listContainer.appendChild(li);
});
const sections = ['preface', 'market', 'spy', 'home', 'direction', 'history', 'write', 'connect', 'broker'];
sections.forEach(sec => {
document.getElementById(sec + '-heading').innerText = translations[lang][sec + 'Heading'];
const container = document.getElementById(sec + '-body');
container.innerHTML = '';
translations[lang][sec + 'Paragraphs'].forEach(text => {
const p = document.createElement('p'); p.innerHTML = text; container.appendChild(p);
});
});
setupTickers();
}
const brokerData = {
usa: ["Robinhood (No fees for options)", "Fidelity Investments", "Charles Schwab", "Interactive Brokers (IBKR)"],
ca: ["Interactive Brokers Canada", "Questrade", "TD Direct Investing"],
mx: ["Interactive Brokers México", "GBM+ (Global Account)", "Grupo Bursátil Mexicano"],
co: ["Interactive Brokers", "Trii (Para acciones locales)", "eToro (CFDs / Acciones fraccionadas)"],
ar: ["Interactive Brokers (Requiere cuenta externa)", "InvertirOnline (IOL)", "Bull Market Brokers"],
cl: ["Interactive Brokers", "Renta4 Chile", "Fintual"],
pe: ["Interactive Brokers", "Kallpa SAB", "Renta4 Perú"],
latam: ["Interactive Brokers LLC (Disponible en la mayoría de países de América Latina)", "eToro", "Hapi App (Para acciones de USA sin comisiones)"]
};
function updateBrokers() {
const country = document.getElementById('country-select').value;
const output = document.getElementById('broker-output');
output.innerHTML = '';
if (country && brokerData[country]) {
const ul = document.createElement('ul');
brokerData[country].forEach(broker => {
const li = document.createElement('li'); li.innerText = broker; ul.appendChild(li);
});
output.appendChild(ul);
}
}
const stockPrices = { "SPY": { price: 742.21, change: "+0.45%" } };
function setupTickers() {
const tickerSpans = document.querySelectorAll('.ticker');
tickerSpans.forEach(span => {
const symbol = span.innerText.trim();
const data = stockPrices[symbol] || { price: 742.21, change: "+0.45%" };
const oldTooltip = span.querySelector('.ticker-tooltip');
if (oldTooltip) oldTooltip.remove();
const tooltip = document.createElement('span');
tooltip.className = 'ticker-tooltip';
tooltip.innerHTML = `<strong>${symbol}</strong><br>Reference price: $${data.price}<br><span style="color: #34d399">${data.change}</span>`;
span.appendChild(tooltip);
});
}
document.addEventListener("DOMContentLoaded", () => {

    const urlParams = new URLSearchParams(window.location.search);
    const urlLanguage = urlParams.get("lang");

    let initialLanguage = "en";

    if (["en", "es", "fr"].includes(urlLanguage)) {
        initialLanguage = urlLanguage;
    } else {
        try {
            const savedLanguage = localStorage.getItem("trading500-language");

            if (["en", "es", "fr"].includes(savedLanguage)) {
                initialLanguage = savedLanguage;
            }
        } catch (error) {}
    }

    document.documentElement.lang = initialLanguage;
    changeLanguage(initialLanguage);

});
</script>
