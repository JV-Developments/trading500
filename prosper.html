        "That is why it is extremely important for traders to accept that what happened will inevitably happen again, and to be prepared to take advantage of the opportunities. History should encourage each of us during difficult days, reminding us that we can recover—and also bring a smile to our faces when we see a scene from the past repeated in the present."
    ],

    writeHeading: "“Qui scribit bis legit” (“Whoever writes, reads twice”)",
    writeParagraphs: [
        "Making a habit of writing down and keeping a record of everything that happens during your trading session will undoubtedly contribute greatly to your progress as a professional trader. At the end of the day, you will be able to review your original plan, how you finished, what mistakes you may have made, and how successful your strategy was in producing substantial returns.",
        "Your records should include tables, charts, and comments, as well as links to useful websites. This will put important tools within easy reach.",
        "The vast majority of investors have always recommended something very simple: “You must know what you are doing and know how to interpret financial instruments.” Warren Buffett, one of the greatest stock investors in history, has repeated this in his talks. Knowing the meaning of basic trading concepts and accepting that history will inevitably repeat itself will give you peace of mind for your future decisions. To emphasize this brief thought—and so that you do not leave your data only in your memory—let us recall the words of the Spanish writer Miguel de Unamuno: “A short pencil is worth more than a long memory.”"
    ],

    connectHeading: "Do You Have a Reliable Connection?",
    connectParagraphs: [
        "Just as it is essential to maintain very good communication with your loved ones and with others in general, it is equally vital to have an excellent internet signal so you can trade from anywhere in the world. The last thing you want in this activity is to lose your internet connection in the middle of an important trade. This occupation gives you the opportunity to generate income from any country on the planet, but your connection must be dependable, because every second involved in transmitting your orders—whether to complete your trade of the day (a purchase, a sale, or both)—is valuable. Data moves so quickly across the Web that even a few seconds can cost you money. This becomes even more important when there is high volatility¹ and volume² in the market.",
        "Ideally, you should be connected in two ways: through your laptop (PC) and your cell phone. If your PC fails, you will have your mobile device to continue your trading session. I want to emphasize that regardless of the strategy you use during your session—day trading (scalping, for example), swing trading (holding for one or more days), or investing (long term)—your connection should provide peace of mind. For all of the above, you will learn to set your stop loss³ or, if you are making a profit, raise your trailing stop⁴. Having an order ready to secure profits if your position moves in the desired direction, up or down, is advantageous, especially when you have already defined an exit point.",
        "¹ Rapid price changes | ² The titles or contracts of a financial asset traded in a market | ³ A sell order designed to limit the amount of a potential loss | ⁴ An order designed to secure profits if your position moves in the desired direction, either up or down."
    ],

    brokerHeading: "The Broker… Will Execute Your Orders",
    brokerParagraphs: [
        "Indeed, to enter the world of trading, a stockbroker—commonly known as a broker—will link your bank account to the broker's account, allowing you to deposit money, buy and sell, and withdraw your profits daily. There are different types of brokers. Some do not charge fees for options trading, while others that offer more services do charge fees.",
        "Not all brokers operating in the United States also operate in the same way abroad. If you are not in the USA, simply select your country below to see the list of brokers available in your region that offer not only stock buying and selling but also options trading, which is what this guide teaches. Some do not charge commissions; others do, usually $0.65 per contract to open and close a position. For example, if you buy 10 contracts of a stock or index, you must pay $6.50 to enter and the same amount to exit. Fees vary from broker to broker. There are also platforms that do not charge you.",
        "In the United States, for example, I recommend Robinhood for beginners: it does not charge fees for options. If you subscribe and add its Gold service (for only US$5 per month), your deposits will be instant, meaning your money will be available immediately for trading. You can open your account in three ways: Instant, Gold, or Cash. Open your account today. If Robinhood is not available in your country, try Fidelity. Open an account with them."
    ]
},

/*
 * Desglose sectorial de SPY: datos oficiales de State Street.
 * Se intenta consultar la página de State Street cada 6 horas. El último
 * resultado válido queda guardado localmente durante 30 días para que el
 * contenido siga visible si la fuente o el servicio intermediario falla.
 */
const SPY_SECTOR_SOURCE_URL = "https://www.ssga.com/us/en/individual/etfs/state-street-spdr-sp-500-etf-trust-spy";
const SPY_SECTOR_PROXY_URL = "https://api.allorigins.win/raw?url=";
const SPY_SECTOR_CACHE_KEY = "trading500-spy-sector-breakdown-v1";
const SPY_SECTOR_REFRESH_MS = 6 * 60 * 60 * 1000;
const SPY_SECTOR_CACHE_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;

const spySectorNamesEs = [
    "Tecnología de la Información",
    "Finanzas",
    "Cuidado de la Salud",
    "Consumidor Discrecional",
    "Servicios de Comunicación",
    "Acciones Industriales",
    "Productos Básicos de Consumo",
    "Energía",
    "Utilidades",
    "Bienes Raíces",
    "Materiales"
];

// Último respaldo oficial verificado, publicado por State Street al 6 nov 2026.
const spySectorFallback = {
    asOf: "Nov 06 2026",
    values: [35.87, 12.64, 10.52, 9.51, 8.84, 8.13, 5.17, 3.54, 2.13, 1.88, 1.78]
};

function parseSpySectorData(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const pageText = (doc.body ? doc.body.innerText : doc.documentElement.textContent)
        .replace(/\s+/g, " ");
    const headingMatch = pageText.match(/Fund Sector Breakdown\s+as of\s+([A-Za-z]{3,9}\s+\d{1,2},?\s+\d{4})/i);
    if (!headingMatch) throw new Error("No se encontró la fecha del desglose sectorial oficial.");

    const sourceNames = [
        "Information Technology", "Financials", "Health Care",
        "Consumer Discretionary", "Communication Services", "Industrials",
        "Consumer Staples", "Energy", "Utilities", "Real Estate", "Materials"
    ];
    const values = sourceNames.map(name => {
        const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const match = pageText.match(new RegExp(escaped + "\\s+([0-9]+(?:[.,][0-9]+)?)\\s*%", "i"));
        if (!match) throw new Error("No se pudo leer el porcentaje de " + name + ".");
        return Number(match[1].replace(",", "."));
    });

    if (values.some(value => !Number.isFinite(value) || value <= 0 || value > 100)) {
        throw new Error("Los porcentajes recibidos no superaron la validación.");
    }
    const total = values.reduce((sum, value) => sum + value, 0);
    if (total < 98 || total > 102) throw new Error("La suma del desglose recibido no es válida.");
    return { asOf: headingMatch[1], values, fetchedAt: Date.now() };
}

function readSpySectorCache() {
    try {
        const saved = JSON.parse(localStorage.getItem(SPY_SECTOR_CACHE_KEY) || "null");
        if (saved && Array.isArray(saved.values) && saved.values.length === 11 &&
            saved.values.every(value => Number.isFinite(value) && value > 0 && value <= 100) &&
            typeof saved.asOf === "string") return saved;
    } catch (error) {}
    return null;
}

function saveSpySectorCache(data) {
    try { localStorage.setItem(SPY_SECTOR_CACHE_KEY, JSON.stringify(data)); } catch (error) {}
}

function formatSpySectorDate(dateText) {
    const parsed = new Date(dateText);
    if (Number.isNaN(parsed.getTime())) return dateText;
    return new Intl.DateTimeFormat("es", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }).format(parsed);
}

function getSpySectorDataForDisplay() {
    const cached = readSpySectorCache();
    if (cached && Date.now() - (cached.fetchedAt || 0) <= SPY_SECTOR_CACHE_MAX_AGE_MS) {
        return { data: cached, status: "cached" };
    }
    return { data: spySectorFallback, status: "fallback" };
}

function renderSpySectorBreakdown(data, statusMessage) {
    const container = document.getElementById("spy-body");
    if (!container) return;
    const paragraphs = container.querySelectorAll("p");
    const sectorParagraph = paragraphs[1];
    if (!sectorParagraph) return;

    const breakdown = spySectorNamesEs.map((name, index) =>
        name + " " + data.values[index].toFixed(2) + "%"
    ).join(" | ");
    sectorParagraph.textContent = "El desglose del sector S&P 500, es así: " + breakdown + ".";

}

async function refreshSpySectorData() {
    const cached = readSpySectorCache();
    if (cached && Date.now() - (cached.fetchedAt || 0) < SPY_SECTOR_REFRESH_MS) return;

    const current = getSpySectorDataForDisplay();
    renderSpySectorBreakdown(current.data, current.status === "fallback" ? "fallback" : "updating");
    try {
        const proxyUrl = SPY_SECTOR_PROXY_URL + encodeURIComponent(SPY_SECTOR_SOURCE_URL);
        const response = await fetch(proxyUrl, { method: "GET", cache: "no-store" });
        if (!response.ok) throw new Error("La consulta de datos no respondió correctamente.");
        const html = await response.text();
        const freshData = parseSpySectorData(html);
        saveSpySectorCache(freshData);
        if (document.documentElement.lang === "es") renderSpySectorBreakdown(freshData, "fresh");
    } catch (error) {
        const lastKnown = readSpySectorCache();
        if (document.documentElement.lang === "es") {
            if (lastKnown) renderSpySectorBreakdown(lastKnown, "stale");
            else renderSpySectorBreakdown(spySectorFallback, "fallback");
        }
        console.warn("No se pudo actualizar el desglose sectorial de SPY:", error);
    }
}

/* Cotizaciones dinámicas mediante el widget de TradingView.
   Los datos pueden tener retraso según el mercado y el acceso disponible. */
const tickerSymbols = {
    "SPY": "AMEX:SPY",
    "AAPL": "NASDAQ:AAPL",
    "NVDA": "NASDAQ:NVDA",
    "MSFT": "NASDAQ:MSFT",
    "AMZN": "NASDAQ:AMZN",
    "GOOGL": "NASDAQ:GOOGL",
    "GOOG": "NASDAQ:GOOG",
    "META": "NASDAQ:META",
    "AVGO": "NASDAQ:AVGO",
    "TSLA": "NASDAQ:TSLA",
    "BRK.B": "NYSE:BRK.B"
};

function makeTextTickers(container) {
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    const pattern = /\b(BRK\.B|AAPL|NVDA|MSFT|AMZN|GOOGL|GOOG|META|AVGO|TSLA|SPY)\b/g;
    nodes.forEach(node => {
        if (!node.nodeValue || (node.parentElement && node.parentElement.closest(".ticker"))) return;
        const value = node.nodeValue;
        pattern.lastIndex = 0;
        if (!pattern.test(value)) return;
        pattern.lastIndex = 0;

        const fragment = document.createDocumentFragment();
        let last = 0;
        let match;
        while ((match = pattern.exec(value)) !== null) {
            fragment.appendChild(document.createTextNode(value.slice(last, match.index)));
            const ticker = document.createElement("span");
            ticker.className = "ticker";
            ticker.tabIndex = 0;
            ticker.dataset.symbol = tickerSymbols[match[0].toUpperCase()];
            ticker.textContent = match[0];
            fragment.appendChild(ticker);
            last = match.index + match[0].length;
        }
        fragment.appendChild(document.createTextNode(value.slice(last)));
        node.parentNode.replaceChild(fragment, node);
    });
}

function loadTickerWidget(ticker, tooltip) {
    if (tooltip.dataset.loaded === "true") return;
    tooltip.dataset.loaded = "true";
    const symbol = ticker.dataset.symbol;
    if (!symbol) {
        tooltip.textContent = "Quote unavailable for this symbol.";
        return;
    }

    const widget = document.createElement("div");
    widget.className = "ticker-widget";
    const inner = document.createElement("div");
    inner.className = "tradingview-widget-container__widget";
    widget.appendChild(inner);

    const script = document.createElement("script");
    script.type = "text/javascript";
    script.async = true;
    script.src = "https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js";
    script.innerHTML = JSON.stringify({
        symbol: symbol,
        width: "100%",
        locale: "en",
        colorTheme: "dark",
        isTransparent: false
    });
    widget.appendChild(script);
    tooltip.appendChild(widget);
}

function setupTickers() {
    document.querySelectorAll("#preface-body, #market-body, #spy-body, #home-body, #direction-body, #history-body, #write-body, #connect-body, #broker-body")
        .forEach(makeTextTickers);

    document.querySelectorAll(".ticker").forEach(ticker => {
        if (!ticker.dataset.symbol) {
            ticker.dataset.symbol = tickerSymbols[ticker.textContent.trim().toUpperCase()] || "";
        }
        ticker.tabIndex = 0;
        let tooltip = ticker.querySelector(".ticker-tooltip");
        if (!tooltip) {
            tooltip = document.createElement("span");
            tooltip.className = "ticker-tooltip";
            ticker.appendChild(tooltip);
        }
        const load = () => loadTickerWidget(ticker, tooltip);
        ticker.addEventListener("mouseenter", load, { once: true });
        ticker.addEventListener("focus", load, { once: true });
    });
}

/* Inglés por defecto. La URL ?lang=en/es/fr tiene prioridad sobre la preferencia guardada. */
document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".lang-btn").forEach(button => {
        button.addEventListener("click", () => {
            const language = button.id.replace("btn-", "");
            changeLanguage(language);
            try {
                localStorage.setItem("trading500-language", language);
            } catch (error) {}
            const url = new URL(window.location.href);
            url.searchParams.set("lang", language);
            window.history.replaceState({}, "", url);
        });
    });

    const urlLanguage = new URLSearchParams(window.location.search).get("lang");
    let initialLanguage = "en";
    if (["en", "es", "fr"].includes(urlLanguage)) {
        initialLanguage = urlLanguage;
    } else {
        try {
            const savedLanguage = localStorage.getItem("trading500-language");
            if (["en", "es", "fr"].includes(savedLanguage)) initialLanguage = savedLanguage;
        } catch (error) {}
    }
    changeLanguage(initialLanguage);
    refreshSpySectorData();
    // Revisa de nuevo al regresar a la pestaña, sin consultar continuamente.
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshSpySectorData();
    });
});
