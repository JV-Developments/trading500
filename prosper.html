<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }
        /* LANGUAGE NAVBAR */
        .lang-navbar {
            background-color: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .lang-btn {
            background: none;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 6px 14px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .lang-btn.active, .lang-btn:hover {
            color: #38bdf8;
            border-color: #38bdf8;
            background-color: #0f172a;
        }
        /* MAIN CONTAINER */
        .guide-container {
            max-width: 800px;
            margin: 40px auto;
            background-color: #1e293b;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        h1, h2, h3 {
            color: #38bdf8;
        }
        h1 {
            font-size: 2.5rem;
            border-bottom: 2px solid #334155;
            padding-bottom: 12px;
            margin-top: 0;
        }
        h2 {
            font-size: 1.8rem;
            margin-top: 35px;
            border-left: 4px solid #3b82f6;
            padding-left: 10px;
        }
        p {
            color: #cbd5e1;
            text-align: justify;
            font-size: 1.05rem;
        }
        ul {
            color: #cbd5e1;
            margin-bottom: 25px;
            padding-left: 20px;
        }
        li {
            margin-bottom: 8px;
        }
        .ticker {
            color: #34d399;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline dotted;
        }
    </style>
</head>
<body>

<!-- Language Selector Navigation -->
<div class="lang-navbar">
    <button class="lang-btn active" onclick="changeLanguage('en')">English</button>
    <button class="lang-btn" onclick="changeLanguage('es')">Español</button>

function changeLanguage(lang) {
// Update active class on buttons
const buttons = document.querySelectorAll('.lang-btn');
buttons.forEach(btn => btn.classList.remove('active'));
event.target.classList.add('active');
        // Load translations into the elements
        document.getElementById('main-title').innerText = translations[lang].title;
        document.getElementById('author-tag').innerText = translations[lang].author;
        document.getElementById('index-title').innerText = translations[lang].indexTitle;
        document.getElementById('index-subtitle').innerText = translations[lang].indexSubtitle;
        document.getElementById('contents-heading').innerText = translations[lang].contentsHeading;

        // Render index list
        const listContainer = document.getElementById('contents-list');
        listContainer.innerHTML = '';
        translations[lang].contents.forEach(item => {
            const li = document.createElement('li');
            li.innerText = item;
            listContainer.appendChild(li);
        });

        // Render Preface heading and paragraphs
        document.getElementById('preface-heading').innerText = translations[lang].prefaceHeading;
        const prefaceContainer = document.getElementById('preface-body');
        prefaceContainer.innerHTML = '';
        translations[lang].prefaceParagraphs.forEach(pText => {
            const p = document.createElement('p');
            p.innerText = pText;
            prefaceContainer.appendChild(p);
        });

        // Renderizar Bolsa de Valores (NUEVO BLOQUE)
        document.getElementById('market-heading').innerText = translations[lang].marketHeading;
        const marketContainer = document.getElementById('market-body');
        marketContainer.innerHTML = '';
        translations[lang].marketParagraphs.forEach(text => {
            const p = document.createElement('p');
            p.innerHTML = text;
            marketContainer.appendChild(p);
        });
